
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="Css/style.css">
    <title>Lista De Catálogos</title>
</head>
<body>
    <h1>Lista de Catálogo de Katas</h1>
    
    <!-- Botones de Crear Cuenta y Registrarse -->
    <div id="nombreUsuario"></div>
    <div>
        <button id="crearCuentaButton">Crear Cuenta</button>
        <button id="registrarseformButton">Registrarse</button>
        <button id="cursosButton" style="display: none;">Ver Cursos</button></a>
        <button id="cerrarSesionButton" style="display: none;">Cerrar Sesión</button>
    </div>

    <!-- HTML en la página principal -->
    <div id="search-container">
        <input type="text" id="search-input" placeholder="Ingrese un catálogo">
        <button id="search-button">Buscar</button>
    </div>
    <label id="sort-select1">Ordenar por título:</label>
    <select id="sort-select">    
        <option value="Para elegir">Ordenar</option>
        <option value="asc">A-Z</option>
        <option value="desc">Z-A</option>
    </select>
        <label id="sort-difficulty1">Ordenar por dificultad:</label>
    <select id="sort-difficulty">
        <option value="sOLOTEXTO">Ordene por Dificultad</option>
        <option value="asc">Fácil → Difícil</option>
        <option value="desc">Difícil → Fácil</option>
    </select>

    <!-- Botón para crear un nuevo kata -->
    <button id="create-kata-button">Crear Nuevo Kata</button>

    <div id="create-kata-form" style="display: none;">
        <input type="text" id="kata-title" placeholder="Título">
        <textarea id="kata-description" placeholder="Descripción"></textarea>
        <select id="kata-difficulty">
            <option value="Facil">Fácil</option>
            <option value="Intermedia">Intermedia</option>
            <option value="Dificil">Difícil</option>
        </select>
        <input type="text" id="kata-category" placeholder="Categoría">
        <select id="kata-type">
            <option value="Ejercicio">Ejercicio</option>
            <option value="Ejemplo">Ejemplo</option>
        </select>
        <button id="save-kata-button">Guardar Kata</button>
    </div>

    <!-- Formulario de Registro e Inicio de Sesión -->
        <!-- Formulario de Registro -->
        <div id="registroForm" style="display: none;">
            <h3>Registro</h3>
            <label for="nombreRegistro">Nombre:</label>
            <input type="text" id="nombreRegistro" name="nombreRegistro" required>
    
            <label for="correoRegistro">Correo electrónico:</label>
            <input type="email" id="correoRegistro" name="correoRegistro" required>
    
            <label for="contrasenaRegistro">Contraseña:</label>
            <input type="password" id="contrasenaRegistro" name="contrasenaRegistro" required>
    
            <button type="button" id="registrarseButton">Registrarse</button>
        </div>
    
        <!-- Formulario de Inicio de Sesión -->
        <div id="loginForm" style="display: none;">
            <h3>Iniciar Sesión</h3>
            <label for="nombreRegistro">Nombre:</label>
            <input type="text" id="nombreloggin" name="nombreloggin" required>

            <label for="contrasena">Contraseña:</label>
            <input type="password" id="contrasena" name="contrasena" required>
    
            <button type="button" id="iniciarSesionButton">Iniciar Sesión</button>
        </div>


    <div id="catalog-container">
        <template id="catalog-template">
            <div class="catalog-box">
                <div class="catalog-item">
                    <p class="Title"></p>
                    <p class="Description"></p>
                    <p class="Difficulty"></p>
                    <p class="Category"></p>
                    <p class="Type"></p>
                    <button class="edit-button">Editar</button>
                    <button class="delete-button">Eliminar</button>
                </div>
            </div>
        </template>
    </div>
    
    <!-- Contenedor para cursos -->
    <div id="curso-container">
       <template id="curso-template">
           <div class="curso-box">
            <div class="curso-item">
                <p class="Title"></p>
                <p class="Description"></p>
                <p class="Category"></p>
            </div>
        </div>
       </template>
   </div>


    <!-- Scripts de tus archivos JavaScript -->
    <script type="module" src="./Pressenter/presenter.js"></script>
</body>
</html>
