<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista De Catálogos</title>
</head>
<body>
    <h1>Lista de Catálogo de Katas</h1>
    <div id="search-container">
        <input type="text" id="search-input" placeholder="Ingrese un catálogo">
        <button id="search-button">Buscar</button>
    </div>
    <label for="sort-select">Ordenar por título:</label>
    <select id="sort-select">    
        <option value="Para elegir">Ordenar</option>
        <option value="asc">A-Z</option>
        <option value="desc">Z-A</option>
    </select>
    <label for="sort-difficulty">Ordenar por dificultad:</label>
    <select id="sort-difficulty">
        <option value="sOLOTEXTO">Ordene por Dificultad</option>
        <option value="asc">Fácil → Difícil</option>
        <option value="desc">Difícil → Fácil</option>
    </select>
    
    <!-- Botón para crear un nuevo kata -->
    <button id="create-kata-button">Crear Nuevo Kata</button>

    <!-- Formulario para crear un nuevo kata (inicialmente oculto) -->
    <div id="create-kata-form" style="display: none;">
        <input type="text" id="kata-title" placeholder="Título">
        <textarea id="kata-description" placeholder="Descripción"></textarea>
        <input type="text" id="kata-difficulty" placeholder="Dificultad">
        <input type="text" id="kata-category" placeholder="Categoría">
        <input type="text" id="kata-type" placeholder="Tipo">
        <button id="save-kata-button">Guardar Kata</button>
    </div>

    <div id="catalog-container">
        <template id="catalog-template">
            <div class="catalog-box">
                <strong class="Title"></strong><br>
                Descripción: <span class="Description"></span><br>
                Dificultad: <span class="Difficulty"></span><br>
                Categoria: <span class="Category"></span><br>
                <span class="Type"></span><br>
            </div>
        </template>
    </div>
    <script type="module" src="./src/presenter.js"></script>
</body>
</html>
